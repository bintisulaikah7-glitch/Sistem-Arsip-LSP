<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Arsip LSP</title>
    <script>
      // Redirect to index.html with all query parameters intact
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        // Ambil base folder path
        var lastSlashIndex = pathname.lastIndexOf('/');
        var basePath = lastSlashIndex !== -1 ? pathname.substring(0, lastSlashIndex + 1) : '/';
        var destination = l.origin + basePath + 'index.html' + l.search + l.hash;
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body style="background-color: #020617; color: #94a3b8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 16px;">Memuat Portal Arsip LSP...</p>
    </div>
  </body>
</html>
