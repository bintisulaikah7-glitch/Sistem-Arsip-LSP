<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:description" content="Sistem manajemen boks arsip LSP, penelusuran berkas pelatihan, tata letak rak fisik drag & drop, dan sinkronisasi Google Sheets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Single Page App redirect handler for GitHub Pages
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Fallback otomatis untuk deployment statis GitHub Pages langsung dari root branch main
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.src || '').includes('main.tsx')) {
          console.warn('[LSP Archive] Mengaktifkan bundel JavaScript statis ./assets/app-bundle.js...');
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/app-bundle.js';
          document.body.appendChild(s);
        }
      }, true);
    </script>
  </body>
</html>
