<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Manajemen Boks Arsip LSP</title>
    
    <!-- Script Tailwind CSS CDN Full Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              }
            }
          }
        }
      }
    </script>
    <script>
      // Single Page App redirect handler for GitHub Pages
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Fallback otomatis untuk deployment statis GitHub Pages
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.src || '').includes('main.tsx')) {
          console.warn('[LSP Archive] Mengaktifkan bundel JavaScript statis ./assets/app-bundle.js...');
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/app-bundle.js';
          document.body.appendChild(s);
        }
      }, true);
    </script>
  </body>
</html>
