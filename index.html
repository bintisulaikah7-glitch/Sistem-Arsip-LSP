<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Manajemen Boks Arsip LSP</title>

  <!-- Google Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeaff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Tata letak kartu lemari & ikon agar selalu rapi dengan border, shadow, dan padding */
    svg {
      display: inline-block;
      vertical-align: middle;
    }
    #root > div {
      width: 100%;
    }
    .card-lemari {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.08);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .card-lemari:hover {
      border-color: #60a5fa;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .info-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0;
      border-bottom: 1px solid #f1f5f9;
      gap: 0.5rem;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .badge-boks {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      border-width: 1px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="module" src="./assets/app-bundle.js"></script>

  <script>
    // Memaksa penataan ulang tampilan setelah React selesai render
    const observer = new MutationObserver(() => {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true, subtree: true });
  </script>
</body>
</html>
